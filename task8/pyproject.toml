[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-project"
version = "0.1.0"
description = "test project"
authors = [
    {"name" = "edwin", "email" = "edwin@edwin.com"},
    {"name" = "bob", "email" = "bob@bob.com"}
]
dependencies = [
    "fastapi>=0.136.1",
    "sqlalchemy>=2.0.49",
    "requests>=2.33.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg>=3.3.3"
]
mysql = [
    "mysql-connector-python>=9.7.0"
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0.3",
]